<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;background:#f7f8fa;color:#1a1a2e;line-height:1.7}
.header{background:#fff;border-bottom:1px solid #e8eaed;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700}
.back-link{color:#148a4e;text-decoration:none;font-size:13px;font-weight:500}
.container{max-width:640px;margin:0 auto;padding:24px 20px 80px}
.lang-switch{display:flex;gap:8px;margin-bottom:20px}
.lang-btn{padding:5px 12px;border:1.5px solid #d0d5dd;border-radius:8px;background:#fff;font-size:12px;cursor:pointer}
.lang-btn.active{border-color:#148a4e;background:#e8f5ee;color:#0a6e3a;font-weight:600}
.card{background:#fff;border-radius:14px;border:1px solid #e8eaed;padding:24px;margin-bottom:20px}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px}
.form-group input,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;transition:border-color 0.2s}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#148a4e}
.form-group textarea{min-height:60px;resize:vertical}
.form-group .hint{font-size:11px;color:#888;margin-top:4px}
.btn{padding:12px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-primary{background:#148a4e;color:#fff;width:100%}
.btn-primary:hover{background:#0e6e3a}
.save-bar{margin-top:20px}
.save-status{display:block;text-align:center;font-size:12px;color:#888;margin-top:8px}
.save-status.success{color:#148a4e}
.save-status.error{color:#e24b4a}
#coord-name{color:#148a4e;font-weight:600}

<h1 id="page-title">更新项目信息</h1>
<a href="/projects/greenhouse/index.html" class="back-link" id="back-link">&larr; 返回项目页面</a>

<div class="lang-switch">
<button class="lang-btn" onclick="switchLang('en')">English</button>

<button class="lang-btn active" onclick="switchLang('zh')">中文</button>

<!-- Groups defined in JS, rendered dynamically -->

<div class="save-bar">
<button class="btn btn-primary" onclick="saveData()" id="btn-save">保存更新</button>
<span class="save-status" id="save-status"></span>
</div>
</div>

function escHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

// Render all form cards
function renderCards(){
const container=document.querySelector('.container');
const L=i18n[currentLang];
// Remove old cards (keep lang-switch and save-bar)
container.querySelectorAll('.card').forEach(c=>c.remove());

fieldGroups.forEach(g=>{
const card=document.createElement('div'); card.className='card';
let html=`<div class="card-title">${g.icon} ${L.groups[g.id]}</div>`;
g.fields.forEach(f=>{
const val=(cloudData.projectInfo||{})[f.key]||'';
const tag=f.type==='textarea'?'<textarea id="f-'+f.key+'" placeholder="">'+escHtml(val)+'</textarea>'
  :'<input type="text" id="f-'+f.key+'" placeholder="" value="'+escHtml(val)+'">';
html+=`<div class="form-group"><label>${L.labels[f.key]}</label>${tag}`;
const hint=L.hints[f.key];
if(hint) html+=`<div class="hint">${hint}</div>`;
html+='</div>';
});
card.innerHTML=html;
// Insert before save-bar
const saveBar=container.querySelector('.save-bar');
container.insertBefore(card, saveBar);
});
}

function switchLang(lang){
currentLang=lang;
document.querySelectorAll('.lang-btn').forEach(btn=>{
btn.classList.toggle('active',btn.textContent.trim()==={en:'English',ru:'Русский',zh:'中文'}[lang]);
});
const L=i18n[lang];
document.getElementById('page-title').textContent=L.pageTitle;
document.getElementById('back-link').textContent=L.backLink;
document.getElementById('back-link').href='/projects/greenhouse/index.html?lang='+lang;
document.getElementById('btn-save').textContent=L.save;
renderCards();
}

async function loadData(){
try{
const res=await fetch(CLOUD_URL,{headers:{'Accept':'application/json'}});
if(res.ok){
cloudData=await res.json();
const cp=cloudData.coordinatorProfile||{}; coordName=cp.name||'HUA';
renderCards();
}
}catch(e){console.log('Load failed:',e)}
}

async function saveData(){
const L=i18n[currentLang];
const statusEl=document.getElementById('save-status');
statusEl.textContent=L.saving; statusEl.className='save-status';

const newInfo={};
fieldGroups.forEach(g=>g.fields.forEach(f=>{
const el=document.getElementById('f-'+f.key);
if(el) newInfo[f.key]=el.value.trim();
}));

// Merge with existing (preserve non-form fields like legacy and freeformNote)
const oldInfo=cloudData.projectInfo||{};
const merged={...oldInfo};
Object.keys(newInfo).forEach(k=>{merged[k]=newInfo[k]});

// Create history
const history=cloudData.editHistory||[];
const changed=Object.keys(newInfo).some(k=>(newInfo[k]||'')!==(oldInfo[k]||''));
if(changed){
history.push({time:Date.now(),previous:{...oldInfo},summary:generateSummary(oldInfo,newInfo)});
}

cloudData.projectInfo=merged;
cloudData.editHistory=history; cloudData.lastUpdated=Date.now();

try{
const res=await fetch(CLOUD_URL,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(cloudData)});
if(res.ok){statusEl.textContent=L.saved;statusEl.className='save-status success';}
else{statusEl.textContent=L.error;statusEl.className='save-status error';}
}catch(e){statusEl.textContent=L.error;statusEl.className='save-status error';}
}

function generateSummary(oldInfo,newInfo){
const L=i18n[currentLang];
const changes=[];
Object.keys(newInfo).forEach(k=>{
if((newInfo[k]||'')!==(oldInfo[k]||'')){
const label=L.labels[k]||k;
if(!oldInfo[k]&&newInfo[k]) changes.push('added '+label);
else if(oldInfo[k]&&!newInfo[k]) changes.push('removed '+label);
else changes.push('updated '+label);
}
});
return changes.join(', ')||'no changes';
}

(function init(){
const params=new URLSearchParams(window.location.search);
const urlLang=params.get('lang');
if(urlLang&&['en','ru','zh'].includes(urlLang)){currentLang=urlLang;}
switchLang(currentLang);
loadData();
})();
</script>
