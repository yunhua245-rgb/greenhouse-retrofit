<div class="hero"><h1 id="hero-title">MODU Modular Toys</h1><p class="hero-sub" id="hero-desc">Sourcing Chinese injection molding factories, equipment suppliers, and mold makers for Danish MODU brand</p><span class="hero-badge"><span class="dot"></span><span id="badge-phase">Project Kickoff</span></span></div>

<div class="section"><div class="section-header"><div class="section-icon" style="background:#fff3e0;color:#e65100">📊</div><div><div class="section-title" data-i18n="s1-title">Project Status</div></div></div><div class="status-strip"><div class="st-card"><div class="st-label" data-i18n="s1-type-l">Project Type</div><div class="st-value orange" id="st-project-type" data-i18n="s1-type-v">OEM Sourcing</div></div><div class="st-card"><div class="st-label" data-i18n="s1-phase-l">Current Phase</div><div class="st-value amber" id="st-current-phase" data-i18n="s1-phase-v">Supplier Research</div></div><div class="st-card"><div class="st-label" data-i18n="s1-suppliers-l">Suppliers Found</div><div class="st-value" id="stat-suppliers">0</div></div></div></div>
<div class="section"><div class="section-header"><div class="section-icon" style="background:#fff3e0;color:#e65100">🧸</div><div><div class="section-title" data-i18n="s2-title">Project Requirement</div></div></div><div class="req-core"><h4 id="req-core-title" data-i18n="s2-core-t">Reference Product</h4><p id="req-core-desc" data-i18n="s2-core-d">MODU (modutoy.com) — Danish brand, life-size modular building toys for children. Target age: 6 months to 6+ years. Looking for Chinese partners for contract manufacturing, equipment procurement, and mold making.</p></div><div class="info-grid" id="project-info-grid"></div></div>

ry produces parts to spec.","track-a-1":"PP injection molded parts","track-a-2":"Other plastic parts","track-a-3":"Cardboard packaging","track-b-tag":"Track B","track-b-title":"Injection Machine Purchase","track-b-desc":"Buy injection molding machine","track-b-1":"Machine selection","track-b-2":"Compatible with PP","track-c-tag":"Track C","track-c-title":"Custom Mold Making","track-c-desc":"Design and manufacture injection molds","track-c-1":"Mold from 3D models","track-c-2":"Each part needs its own mold","s4-title":"Supplier Progress","s4-sub":"By sourcing track","s4-total":"Evaluated","s4-active":"In Discussion","s4-quoted":"Quoted","col-a-title":"Track A · OEM","col-b-title":"Track B · Equipment","col-c-title":"Track C · Molds","col-empty":"None yet","s5-title":"Your Coordinator","s5-r1":"Supplier screening","s5-r2":"Price negotiation","s5-r3":"Project coordination","s5-r4":"Quality assurance","update-text":"Page updated at every milestone","update-time":"Jun 4, 2026"},ru:{"hero-title":"MODU — Поиск производства в Китае","hero-desc":"Поиск китайских заводов для литья под давлением, поставщиков оборудования и производителей пресс-форм","badge-phase":"Запуск проекта","s1-title":"Статус проекта","s1-type-l":"Тип проекта","s1-type-v":"OEM поиск","s1-phase-l":"Текущий этап","s1-phase-v":"Поиск поставщиков","s1-suppliers-l":"Найдено","s2-title":"Требования","s2-core-t":"Продукт","s2-core-d":"MODU (modutoy.com) — датский бренд модульных игрушек для детей 6 мес. – 6 лет. Ищем партнеров в Китае.","s3-title":"Направления поиска","track-a-tag":"A","track-a-title":"Контрактное производство","track-a-desc":"Предоставить 3D-модели и чертежи","track-a-1":"Литье под давлением","track-a-2":"Пластиковые детали","track-a-3":"Упаковка","track-b-tag":"B","track-b-title":"Оборудование","track-b-desc":"Закупка ТПА","track-b-1":"Выбор машины","track-b-2":"Совместимость с PP","track-c-tag":"C","track-c-title":"Пресс-формы","track-c-desc":"Изготовление пресс-форм","track-c-1":"По 3D-моделям","track-c-2":"Для каждой детали","s4-title":"Прогресс","s4-sub":"По направлениям","s4-total":"Оценено","s4-active":"Обсуждение","s4-quoted":"КП","col-a-title":"A · OEM","col-b-title":"B · Оборуд.","col-c-title":"C · Формы","col-empty":"Пока нет","s5-title":"Координатор","s5-r1":"Отбор","s5-r2":"Переговоры","s5-r3":"Координация","s5-r4":"Контроль","update-text":"Обновляется на каждом этапе","update-time":"04.06.2026"}};
let currentLang='zh';
(function(){const p=new URLSearchParams(window.location.search);const l=p.get('lang');if(l&&['en','ru','zh'].includes(l))currentLang=l})();
function switchLang(l){currentLang=l;document.querySelectorAll('.lang-btn').forEach(b=>{b.classList.toggle('active',b.textContent.trim()==={en:'English',ru:'Русский',zh:'中文'}[l])});document.getElementById('hero-title').textContent=i18n[l]['hero-title'];document.getElementById('hero-desc').textContent=i18n[l]['hero-desc'];document.getElementById('badge-phase').textContent=i18n[l]['badge-phase'];document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(i18n[l][k])el.textContent=i18n[l][k]});renderSuppliers();renderCoordinator();renderDynamicProjectInfo();renderDisplayContent()}
let suppliersData=[],coordinatorProfile={},projectInfo={};
async function fetchData(){try{const r=await fetch('/api/modu-data');if(r.ok){const d=await r.json();suppliersData=d.suppliers||[];projectInfo=d.projectInfo||{}}}catch(e){}try{const r=await fetch('/api/data');if(r.ok){const d=await r.json();coordinatorProfile=d.coordinatorProfile||{}}}catch(e){}renderSuppliers();renderCoordinator();renderDynamicProjectInfo();renderDisplayContent();if(currentLang!=='zh')switchLang(currentLang)}
function renderSuppliers(){const s=suppliersData;document.getElementById('eval-total').textContent=s.length;document.getElementById('eval-active').textContent=s.filter(x=>['contacting','quoted'].includes(x.status)).length;document.getElementById('eval-quoted').textContent=s.filter(x=>x.status==='quoted').length;document.getElementById('stat-suppliers').textContent=s.filter(x=>x.status!=='rejected').length;const stL={zh:{new:'新增',contacting:'沟通中',quoted:'已报价',selected:'已选定',shortlisted:'候选'},en:{new:'New',contacting:'In discussion',quoted:'Quoted',selected:'Selected',shortlisted:'Shortlisted'},ru:{new:'Новый',contacting:'Обсуждение',quoted:'КП',selected:'Выбран',shortlisted:'Шорт-лист'}};const emp=i18n[currentLang]['col-empty']||'暂无';const trackA=s.filter(x=>x.status!=='rejected'&&(!x.track||x.track==='A'||/代工|OEM/i.test(x.track||'')));const trackB=s.filter(x=>x.status!=='rejected'&&(x.track==='B'||/设备/i.test(x.track||'')));const trackC=s.filter(x=>x.status!=='rejected'&&(x.track==='C'||/模具|mold/i.test(x.track||'')));function rCol(i){if(i.length===0)return'<div class="col-empty">'+emp+'</div>';return i.map(x=>{const l=(stL[currentLang]||stL.zh)[x.status]||'new';const bc=x.status==='selected'?'badge-green':x.status==='quoted'?'badge-blue':'badge-amber';return'<div class="sup-item"><div style="font-weight:600;font-size:13px">'+escHtml(x.name||'')+'</div><div class="sup-detail">'+(x.location||'')+'</div><div class="sup-status"><span class="badge '+bc+'">'+l+'</span></div></div>'}).join('')}document.getElementById('col-a-body').innerHTML=rCol(trackA);document.getElementById('col-b-body').innerHTML=rCol(trackB);document.getElementById('col-c-body').innerHTML=rCol(trackC)}
function renderCoordinator(){const p=coordinatorProfile;const a=document.getElementById('coord-avatar');const n=document.getElementById('coord-name');const c=document.getElementById('coord-city');const b=document.getElementById('coord-bio');const g=document.getElementById('contact-grid');if(p.avatarUrl)a.innerHTML='<img src="'+escHtml(p.avatarUrl)+'" alt="">';else a.textContent=(p.name||'A').charAt(0).toUpperCase();n.textContent=p.name||'Amalia HOU';c.textContent=p.city||'Beijing, China';b.textContent=p.bio||'';b.style.display=p.bio?'block':'none';const cs=[];if(p.whatsapp)cs.push({icon:'📲',label:'WhatsApp',value:p.whatsapp,href:'https://wa.me/'+p.whatsapp.replace(/[^0-9]/g,'')});if(p.telegram)cs.push({icon:'✈️',label:'Telegram',value:p.telegram,href:'https://t.me/'+p.telegram.replace('@','')});if(p.phone)cs.push({icon:'📱',label:'Phone',value:p.phone,href:'tel:'+p.phone});if(p.wechat)cs.push({icon:'💬',label:'WeChat',value:p.wechat,href:null});if(cs.length>0){g.style.display='flex';g.innerHTML=cs.map(x=>x.href?'<a href="'+escHtml(x.href)+'" class="contact-chip" target="_blank">'+x.icon+' '+x.label+': '+x.value+'</a>':'<span class="contact-chip">'+x.icon+' '+x.label+': '+x.value+'</span>').join('')}else g.style.display='none'}
function escHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function renderDynamicProjectInfo(){const info=projectInfo;if(!info||Object.keys(info).length===0)return;const fm=[{key:'productName',zh:'产品名称',en:'Product Name',ru:'Название'},{key:'productUsage',zh:'用途/场景',en:'Usage',ru:'Назначение'},{key:'specifications',zh:'规格参数',en:'Specifications',ru:'Спецификации'},{key:'quantity',zh:'采购数量',en:'Quantity',ru:'Количество'},{key:'certifications',zh:'认证要求',en:'Certifications',ru:'Сертификация'},{key:'budget',zh:'目标预算',en:'Budget',ru:'Бюджет'},{key:'tradeTerms',zh:'贸易条款',en:'Trade Terms',ru:'Условия'},{key:'paymentTerms',zh:'付款方式',en:'Payment',ru:'Оплата'},{key:'destination',zh:'收货地',en:'Destination',ru:'Пункт'},{key:'timeline',zh:'期望交期',en:'Timeline',ru:'Сроки'},{key:'supplierType',zh:'供应商类型',en:'Supplier Type',ru:'Тип'},{key:'supplierRegion',zh:'地区偏好',en:'Region',ru:'Регион'},{key:'oemOdm',zh:'OEM/ODM',en:'OEM/ODM',ru:'OEM/ODM'}];const lang=currentLang;const ff=fm.filter(f=>info[f.key]);if(ff.length===0)return;document.getElementById('project-info-grid').innerHTML=ff.map(f=>{const label=f[lang]||f.zh;return'<div class="info-item"><div class="info-label">'+escHtml(label)+'</div><div class="info-value">'+escHtml(info[f.key])+'</div></div>'}).join('')}

function renderDisplayContent(){const p=projectInfo;if(p.projectType){const e=document.getElementById("st-project-type");if(e)e.textContent=p.projectType}if(p.currentPhase){const e=document.getElementById("st-current-phase");if(e)e.textContent=p.currentPhase}if(p.coreRequirementTitle){const e=document.getElementById("req-core-title");if(e)e.textContent=p.coreRequirementTitle}if(p.coreRequirementDesc){const e=document.getElementById("req-core-desc");if(e)e.textContent=p.coreRequirementDesc}}
fetchData();
</script>
